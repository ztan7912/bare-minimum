[project]
name = "BareMinimumQueueTimeAdded"
version = "0.1.1"
description = "Bare minimum UiPath Python function that adds the current UTC time to Test_Queue."
authors = [{ name = "Zheng Tan" }]
requires-python = ">=3.11"
dependencies = [
    "uipath>=2.10.70,<3",
]

[project.optional-dependencies]
scripts = [
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
